name: Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # minimum from requires-python, the version used for the binaries (build.yml) and the latest
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run tests
        run: make test

  e2e:
    name: e2e (ilivalidator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: '3.12'
          enable-cache: true

      - name: Set up java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # the version is only defined in the Makefile
      - name: Read ilivalidator version
        id: ilivalidator
        run: |
          echo "version=$(make -s --eval 'print-ilivalidator-version: ; @echo $(ILIVALIDATOR_VERSION)' print-ilivalidator-version)" >> "$GITHUB_OUTPUT"

      - name: Cache ilivalidator
        uses: actions/cache@v4
        with:
          path: build/ilivalidator-*
          key: ilivalidator-${{ steps.ilivalidator.outputs.version }}

      - name: Run e2e tests
        run: make test-e2e
