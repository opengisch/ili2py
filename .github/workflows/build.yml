name: Build Binaries

on:
  push:
    branches:
      - "*github-build-edit"
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - master

jobs:
  generate_test_output:
    name: Build Artifacts for test output
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml npm
      - name: Install browsers for puppeteer
        run: npx puppeteer browsers install chrome
      - name: Install Mermaid CLI
        run: |
          sudo npm install -g @mermaid-js/mermaid-cli
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout replaces the pushed annotated tag by a lightweight one, setuptools-scm (git describe)
      # would then pick another annotated tag on the same commit (actions/checkout#290)
      - name: Fetch annotated tags
        run: git fetch --force --tags
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true
      - name: Build Artifacts
        run: |
          echo "{\"executablePath\": \"$(ls -d ~/.cache/puppeteer/chrome/linux-*/chrome-linux*/chrome | head -n 1)\", \"args\": [\"--no-sandbox\", \"--disable-setuid-sandbox\"]}" > puppeteer-config.json
          make output-test
      - name: Move Artifact ZIP
        run: |
          mkdir dist_upload
          mv build/ili2py_output_test.zip dist_upload/ili2py_output_test.zip
        shell: bash
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        # PR artifacts use the repository default retention, pr-cleanup.yml deletes them when the PR closes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
        with:
          name: ili2py_output_test${{ github.event_name == 'pull_request' && format('-pr{0}', github.event.pull_request.number) || '' }}
          path: dist_upload/ili2py_output_test.zip
          retention-days: ${{ github.event_name != 'pull_request' && 3 || '' }}
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout replaces the pushed annotated tag by a lightweight one, setuptools-scm (git describe)
      # would then pick another annotated tag on the same commit (actions/checkout#290)
      - name: Fetch annotated tags
        run: git fetch --force --tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies (Linux/MacOS)
        if: runner.os != 'Windows'
        run: |
          make install-dev

      - name: Build binary (Linux/MacOS)
        if: runner.os != 'Windows'
        run: |
          make binary

      - name: Test binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          # check if it exits non zero
          ./dist/ili2py --version
          if [ $? -ne 0 ]; then
            echo "Binary test failed"
            exit 1
          fi
          ./dist/ili2py -v diagram -i tests/data/models/OeREBKRMtrsfr_V2_0/OeREBKRMtrsfr_V2_0.imd -f plantuml -o .generated
          ./dist/ili2py -v diagram -i tests/data/models/OeREBKRMtrsfr_V2_0/OeREBKRMtrsfr_V2_0.imd -f mermaid -o .generated
          ./dist/ili2py -v python-classes -i tests/data/models/OeREBKRMtrsfr_V2_0/OeREBKRMtrsfr_V2_0.imd -o .generated -l interface

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          uv sync --locked

      - name: Build binary (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run --locked pyinstaller --name ili2py --onefile --noconfirm --add-data "src\ili2py:ili2py" src\ili2py\cli.py

      - name: Test binary (Windows)
        if: runner.os == 'Windows'
        run: |
          # check if it exits non zero
          $binary = ".\dist\ili2py.exe"
          # check exit code
          & $binary --version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          .\dist\ili2py.exe -v diagram -i tests\data\models\OeREBKRMtrsfr_V2_0\OeREBKRMtrsfr_V2_0.imd -f plantuml -o .generated
          .\dist\ili2py.exe -v diagram -i tests\data\models\OeREBKRMtrsfr_V2_0\OeREBKRMtrsfr_V2_0.imd -f mermaid -o .generated
          .\dist\ili2py.exe -v python-classes -i tests\data\models\OeREBKRMtrsfr_V2_0\OeREBKRMtrsfr_V2_0.imd -o .generated -l interface

      - name: Rename binary
        run: |
          mkdir dist_upload
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            suffix="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" =~ ^refs/pull/([0-9]+)/ ]]; then
            suffix="latest-pr${BASH_REMATCH[1]}"
          else
            suffix="latest"
          fi
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            mv dist/ili2py "dist_upload/ili2py-linux-$suffix"
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            mv dist/ili2py "dist_upload/ili2py-macos-$suffix"
          else
            mv dist/ili2py.exe "dist_upload/ili2py-windows-$suffix.exe"
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        # PR artifacts use the repository default retention, pr-cleanup.yml deletes them when the PR closes
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v')))
        with:
          name: ${{ runner.os }}-binary${{ github.event_name == 'pull_request' && format('-pr{0}', github.event.pull_request.number) || '' }}
          path: dist_upload/*
          retention-days: ${{ github.event_name != 'pull_request' && 3 || '' }}
  release_latest:
    name: Release Latest
    permissions:
      contents: write
    needs: [ build, generate_test_output ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist_upload

      - name: Flatten artifacts for release
        run: |
          mkdir dist_flat
          find dist_upload -type f -exec cp {} dist_flat/ \;

      - name: Create GitHub Release Latest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: dist_flat/*
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
  release:
    name: Release ${{ github.ref_name }}
    permissions:
      contents: write
    needs: [ build, generate_test_output ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout replaces the pushed annotated tag by a lightweight one, setuptools-scm (git describe)
      # would then pick another annotated tag on the same commit (actions/checkout#290)
      - name: Fetch annotated tags
        run: git fetch --force --tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist_upload

      - name: Flatten artifacts for release
        run: |
          mkdir dist_flat
          find dist_upload -type f -exec cp {} dist_flat/ \;
          cp dist/* dist_flat/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist_flat/*
  pypi:
    name: Publish ${{ github.ref_name }} to PyPI
    needs: release
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/project/interlis2py/
    permissions:
      contents: read
      # trusted publishing, no API token needed
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # checkout replaces the pushed annotated tag by a lightweight one, setuptools-scm (git describe)
      # would then pick another annotated tag on the same commit (actions/checkout#290)
      - name: Fetch annotated tags
        run: git fetch --force --tags

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build wheel and sdist
        run: uv build

      - name: Publish to PyPI
        run: uv publish
