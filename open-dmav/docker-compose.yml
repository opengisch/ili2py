services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: open_dmav
      POSTGRES_USER: open_dmav
      POSTGRES_PASSWORD: open_dmav
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_dmav -d open_dmav"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db_data:/var/lib/postgresql/data

  web:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: open_dmav.settings
      POSTGRES_DB: open_dmav
      POSTGRES_USER: open_dmav
      POSTGRES_PASSWORD: open_dmav
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      TIME_ZONE: UTC
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]

volumes:
  db_data:
